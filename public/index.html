<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CORBET-IA</title>
  <meta name="description" content="CORBET-IA: asistente inteligente de compras con catálogo, promociones y sucursales." />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Tema guardado antes de pintar (evita parpadeo).
    try {
      const t = localStorage.getItem("corbet-ia:tema");
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="fondo-vivo" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="progreso" class="progreso" aria-hidden="true"></div>
  <!-- ================= Cabecera ================= -->
  <div class="franja"><span id="franja-texto"></span></div>
  <header class="cabecera">
    <div class="contenedor cabecera__fila">
      <a href="#inicio" class="marca" aria-label="CORBET-IA">
        <img class="logo-color" src="logo.svg" alt="" width="44" height="44" /><img class="logo-blanco" src="logo-blanco.svg" alt="" width="44" height="44" />
        <span class="marca__texto">
          <span class="marca__nombre">CORBET<span class="marca__ia">IA</span></span>
          <span class="marca__lema" data-i18n="marca.lema"></span>
        </span>
      </a>

      <span class="etq-admin solo-admin" data-i18n="adm.modo"></span>

      <nav id="menu-movil" class="nav" aria-label="Secciones">
        <!-- Tienda (invitados y clientes) -->
        <a href="#inicio" data-ruta="inicio" class="solo-tienda" data-i18n="nav.inicio"></a>
        <a href="#catalogo" data-ruta="catalogo" class="solo-tienda" data-i18n="nav.catalogo"></a>
        <a href="#promociones" data-ruta="promociones" class="solo-tienda" data-i18n="nav.promociones"></a>
        <a href="#asistente" data-ruta="asistente" class="solo-tienda" data-i18n="nav.asistente"></a>
        <a href="#sucursales" data-ruta="sucursales" class="solo-tienda" data-i18n="nav.sucursales"></a>
        <!-- Administración -->
        <a href="#admin:resumen" data-ruta="admin:resumen" class="solo-admin" data-i18n="adm.tab.resumen"></a>
        <a href="#admin:productos" data-ruta="admin:productos" class="solo-admin" data-i18n="adm.tab.productos"></a>
        <a href="#admin:descuentos" data-ruta="admin:descuentos" class="solo-admin" data-i18n="adm.tab.descuentos"></a>
        <a href="#admin:ia" data-ruta="admin:ia" class="solo-admin" data-i18n="adm.tab.ia"></a>
        <a href="#admin:config" data-ruta="admin:config" class="solo-admin" data-i18n="adm.tab.config"></a>
        <a href="#inicio" data-ruta="inicio" class="solo-admin" data-i18n="adm.verTienda"></a>
      </nav>

      <div class="acciones-top">
        <button id="btn-idioma" class="btn-top btn-top--texto" type="button" data-i18n-title="top.idioma">EN</button>
        <button id="btn-tema" class="btn-top" type="button" data-i18n-title="top.tema">
          <svg class="ico-sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button id="btn-cuenta" class="btn-top btn-top--cuenta" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span id="txt-cuenta"></span>
        </button>
        <button id="btn-carrito" class="btn-top" type="button" data-i18n-title="top.carrito">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg>
          <span id="badge-carrito" class="badge" hidden>0</span>
        </button>
        <button id="btn-menu" class="btn-top solo-movil" type="button" aria-label="Menú">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="ticker" aria-label="Ofertas"><div id="ticker" class="ticker__pista"></div></div>

  <main>
    <!-- ======================= 1. INICIO ======================= -->
    <section class="vista" data-vista="inicio">
      <div id="hero" class="hero">
        <div id="hero-slides" class="hero__slides"></div>
        <div class="hero__controles contenedor">
          <div id="hero-puntos" class="hero__puntos"></div>
          <div class="hero__flechas">
            <button id="hero-prev" type="button" aria-label="Anterior">←</button>
            <button id="hero-next" type="button" aria-label="Siguiente">→</button>
          </div>
        </div>
      </div>

      <div class="contenedor bloque">
        <header class="bloque__cabeza">
          <div>
            <span id="inicio-ofertas-contador" class="sobretitulo"></span>
            <h2 class="titulo-display" data-i18n="ofertas.titulo"></h2><p data-i18n="ofertas.sub"></p>
          </div>
          <a href="#promociones" class="enlace-flecha" data-i18n="comun.verTodo"></a>
        </header>
        <div id="inicio-ofertas" class="ofertas"></div>
      </div>

      <div class="contenedor bloque">
        <header class="bloque__cabeza">
          <div><h2 class="titulo-display" data-i18n="inicio.accesos"></h2><p data-i18n="inicio.accesos.sub"></p></div>
        </header>
        <div id="accesos" class="accesos"></div>
      </div>

      <div class="contenedor bloque">
        <header class="bloque__cabeza">
          <div><h2 class="titulo-display" data-i18n="inicio.destacados"></h2><p data-i18n="inicio.destacados.sub"></p></div>
          <a href="#catalogo" class="enlace-flecha" data-i18n="comun.verTodo"></a>
        </header>
        <div id="inicio-destacados" class="grid-productos"></div>
      </div>

      <div class="banda-negra">
        <div class="contenedor banda-negra__fila">
          <div>
            <span class="sobretitulo sobretitulo--claro" data-i18n="inicio.banner.etq"></span>
            <h2 class="titulo-display" data-i18n="inicio.banner.t"></h2>
            <p data-i18n="inicio.banner.d"></p>
          </div>
          <button type="button" class="btn btn--claro" data-promo-cats="Electrodomésticos|Hogar|Televisores" data-i18n="inicio.banner.cta"></button>
        </div>
      </div>

      <div class="contenedor bloque">
        <header class="bloque__cabeza">
          <div><h2 class="titulo-display" data-i18n="inicio.categorias"></h2><p data-i18n="inicio.categorias.sub"></p></div>
        </header>
        <div id="inicio-categorias" class="categorias"></div>
      </div>

      <div class="contenedor bloque">
        <header class="bloque__cabeza">
          <div><h2 class="titulo-display" data-i18n="inicio.reco"></h2><p data-i18n="inicio.reco.sub"></p></div>
          <a href="#asistente" class="enlace-flecha" data-i18n="inicio.hablar"></a>
        </header>
        <div id="inicio-reco" class="grid-productos"></div>
      </div>
    </section>

    <!-- ======================= 2. CATÁLOGO ======================= -->
    <section class="vista" data-vista="catalogo" hidden>
      <div class="contenedor bloque">
        <header class="pagina__cabeza">
          <div><h1 class="titulo-display" data-i18n="cat.titulo"></h1><p data-i18n="cat.sub"></p></div>
          <span id="fuente" class="pill pill--demo"></span>
        </header>

        <div class="catalogo">
          <aside id="cat-filtros" class="filtros">
            <div class="filtros__grupo">
              <input id="cat-buscar" type="search" data-i18n-placeholder="cat.buscar" />
            </div>
            <div class="filtros__grupo">
              <h3 data-i18n="cat.categorias"></h3>
              <div id="f-categorias" class="filtros__lista"></div>
            </div>
            <div class="filtros__grupo">
              <h3 data-i18n="cat.precio"></h3>
              <div class="rango">
                <input id="cat-min" type="number" min="0" step="50000" data-i18n-placeholder="cat.min" />
                <span>—</span>
                <input id="cat-max" type="number" min="0" step="50000" data-i18n-placeholder="cat.max" />
              </div>
            </div>
            <div class="filtros__grupo">
              <label class="interruptor"><span data-i18n="cat.soloDesc"></span><input id="f-desc" type="checkbox" /><span class="interruptor__pista" aria-hidden="true"></span></label>
              <label class="interruptor"><span data-i18n="cat.soloDisp"></span><input id="f-disp" type="checkbox" /><span class="interruptor__pista" aria-hidden="true"></span></label>
            </div>
            <div class="filtros__grupo">
              <h3 data-i18n="cat.marcas"></h3>
              <div id="f-marcas" class="filtros__lista filtros__lista--marcas"></div>
            </div>
            <button id="cat-limpiar" type="button" class="btn btn--contorno ancho" data-i18n="cat.limpiar"></button>
          </aside>

          <div class="catalogo__main">
            <div class="barra">
              <button id="cat-toggle-filtros" type="button" class="btn btn--contorno solo-movil" data-i18n="cat.mostrarFiltros"></button>
              <span id="cat-resultados" class="barra__info"></span>
              <span class="espacio"></span>
              <select id="cat-orden" aria-label="Orden">
                <option value="relevancia" data-i18n="cat.orden.relevancia"></option>
                <option value="descuento" data-i18n="cat.orden.descuento"></option>
                <option value="menor" data-i18n="cat.orden.menor"></option>
                <option value="mayor" data-i18n="cat.orden.mayor"></option>
                <option value="nombre" data-i18n="cat.orden.nombre"></option>
              </select>
              <button id="abrir-conexion" type="button" class="btn btn--negro" data-i18n="cat.conectar"></button>
            </div>
            <div id="cat-activos" class="filtros-activos"></div>
            <div id="cat-grid" class="grid-cuadros"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ======================= 3. PROMOCIONES ======================= -->
    <section class="vista" data-vista="promociones" hidden>
      <div class="contenedor bloque">
        <header class="pagina__cabeza">
          <div><h1 class="titulo-display" data-i18n="promo.titulo"></h1><p data-i18n="promo.sub"></p></div>
        </header>

        <h2 class="subtitulo" data-i18n="promo.vigentes"></h2>
        <div id="promo-vigentes" class="promos"></div>

        <h2 class="subtitulo" data-i18n="ofertas.titulo"></h2>
        <div id="promo-ofertas" class="ofertas"></div>

        <h2 class="subtitulo" data-i18n="promo.proximas"></h2>
        <div id="promo-proximas" class="proximas"></div>

        <h2 class="subtitulo" data-i18n="promo.porCategoria"></h2>
        <div id="promo-categorias" class="promo-cats"></div>
      </div>
    </section>

    <!-- ======================= 4. ASISTENTE VIRTUAL ======================= -->
    <section class="vista" data-vista="asistente" hidden>
      <div class="contenedor bloque">
        <header class="pagina__cabeza">
          <div><h1 class="titulo-display" data-i18n="asis.titulo"></h1><p data-i18n="asis.sub"></p></div>
        </header>

        <div class="asistente">
          <div class="asistente__principal">
          <div class="chat" data-chat="productos">
            <div class="chat__cabeza">
              <div class="segmentos">
                <button type="button" class="segmento activa" data-modo-chat="productos" data-i18n="asis.modo.productos"></button>
                <button type="button" class="segmento" data-modo-chat="comercial" data-i18n="asis.modo.comercial"></button>
              </div>
              <button class="btn-icono chat__reset" type="button" data-i18n-title="asis.nueva">↺</button>
            </div>
            <div class="chat__mensajes" aria-live="polite">
              <div class="chat__vacio">
                <img src="logo.svg" alt="" width="64" height="64" />
                <h3 class="titulo-display" data-i18n="asis.hola"></h3>
                <p data-i18n="asis.holaSub"></p>
                <div class="chips">
                  <button type="button" class="chip" data-i18n="asis.s1"></button>
                  <button type="button" class="chip" data-i18n="asis.s2"></button>
                  <button type="button" class="chip" data-i18n="asis.s3"></button>
                  <button type="button" class="chip" data-i18n="asis.s4"></button>
                </div>
              </div>
            </div>
            <form class="chat__form">
              <textarea rows="1" data-i18n-placeholder="asis.placeholder" autocomplete="off"></textarea>
              <button class="btn btn--negro" type="submit" data-i18n="asis.enviar"></button>
            </form>
          </div>

          <!-- Contactos del equipo (ocupa el espacio bajo el chat) -->
          <section class="contactos" aria-labelledby="contactos-titulo">
            <header class="contactos__cabeza">
              <div>
                <span class="sobretitulo" data-i18n="cont.etq"></span>
                <h2 id="contactos-titulo" class="titulo-display" data-i18n="cont.titulo"></h2>
                <p class="nota" data-i18n="cont.sub"></p>
              </div>
            </header>
            <div id="lista-contactos" class="contactos__grid"></div>
            <p class="nota" data-i18n="cont.aviso"></p>
          </section>
          </div>

          <aside class="asistente__lado">
            <div class="panel-lateral">
              <h3 data-i18n="asis.c.titulo"></h3>
              <div class="consultas">
                <button type="button" data-consulta data-i18n="asis.c1"></button>
                <button type="button" data-consulta data-i18n="asis.c2"></button>
                <button type="button" data-consulta data-i18n="asis.c3"></button>
                <button type="button" data-consulta data-i18n="asis.c4"></button>
                <button type="button" data-consulta data-i18n="asis.c5"></button>
              </div>
            </div>
            <div class="panel-lateral">
              <h3 data-i18n="asis.reco"></h3>
              <div id="asis-reco" class="reco-lista"></div>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <!-- ======================= 5. SUCURSALES ======================= -->
    <section class="vista" data-vista="sucursales" hidden>
      <div class="contenedor bloque">
        <header class="pagina__cabeza">
          <div><h1 class="titulo-display" data-i18n="suc.titulo"></h1><p data-i18n="suc.sub"></p></div>
        </header>

        <div class="sucursales">
          <div class="sucursales__mapa">
            <div id="mapa" class="mapa" role="region" aria-label="Mapa"></div>
            <p class="aviso" data-i18n="suc.aviso"></p>
          </div>
          <div class="sucursales__lista">
            <div class="barra">
              <select id="suc-ciudad" aria-label="Ciudad"></select>
              <select id="suc-marca" aria-label="Marca"></select>
            </div>
            <div id="lista-sucursales" class="lista-sucursales"></div>
            <p id="suc-lineas" class="nota"></p>
          </div>
        </div>

        <div class="chat chat--sucursales" data-chat="sucursales">
          <div class="chat__cabeza">
            <div><strong data-i18n="suc.ia"></strong> <span class="nota" data-i18n="suc.iaSub"></span></div>
            <button class="btn-icono chat__reset" type="button" data-i18n-title="asis.nueva">↺</button>
          </div>
          <div class="chat__mensajes" aria-live="polite">
            <div class="chat__vacio">
              <div class="chips">
                <button type="button" class="chip" data-i18n="suc.s1"></button>
                <button type="button" class="chip" data-i18n="suc.s2"></button>
                <button type="button" class="chip" data-i18n="suc.s3"></button>
                <button type="button" class="chip" data-i18n="suc.s4"></button>
              </div>
            </div>
          </div>
          <form class="chat__form">
            <textarea rows="1" data-i18n-placeholder="asis.placeholder" autocomplete="off"></textarea>
            <button class="btn btn--negro" type="submit" data-i18n="asis.enviar"></button>
          </form>
        </div>
      </div>
    </section>

    <!-- ======================= 6. ADMINISTRACIÓN ======================= -->
    <section class="vista" data-vista="admin" hidden>
      <div class="contenedor bloque">
        <header class="pagina__cabeza">
          <div><h1 class="titulo-display" data-i18n="adm.titulo"></h1><p data-i18n="adm.sub"></p></div>
        </header>
        <p class="aviso" data-i18n="adm.aviso"></p>

        <div class="tabs" role="tablist">
          <button type="button" class="tab activa" data-adm-tab="resumen" data-i18n="adm.tab.resumen"></button>
          <button type="button" class="tab" data-adm-tab="productos" data-i18n="adm.tab.productos"></button>
          <button type="button" class="tab" data-adm-tab="descuentos" data-i18n="adm.tab.descuentos"></button>
          <button type="button" class="tab" data-adm-tab="ia" data-i18n="adm.tab.ia"></button>
          <button type="button" class="tab" data-adm-tab="config" data-i18n="adm.tab.config"></button>
        </div>

        <!-- Resumen -->
        <div class="adm-panel" data-panel="resumen">
          <div id="adm-kpis" class="kpis"></div>
          <div class="dash">
            <div class="tarjeta-dash tarjeta-dash--ancha">
              <header><div><h3 data-i18n="adm.g.ventas"></h3><p class="nota" data-i18n="adm.g.ventasSub"></p></div>
                <button type="button" class="enlace" data-tabla="ventas"></button></header>
              <div id="lienzo-ventas" class="lienzo"><canvas id="graf-ventas" role="img" aria-label="Ventas"></canvas></div>
              <div id="tabla-ventas" hidden></div>
            </div>
            <div class="tarjeta-dash">
              <header><div><h3 data-i18n="adm.g.categorias"></h3><p class="nota" data-i18n="adm.g.categoriasSub"></p></div>
                <button type="button" class="enlace" data-tabla="categorias"></button></header>
              <div id="lienzo-categorias" class="lienzo lienzo--alto"><canvas id="graf-categorias" role="img" aria-label="Categorías"></canvas></div>
              <div id="tabla-categorias" hidden></div>
            </div>
            <div class="tarjeta-dash">
              <header><h3 data-i18n="adm.stockBajo"></h3></header>
              <ul id="adm-alertas" class="lista-dash"></ul>
              <header class="mt"><h3 data-i18n="adm.pedidos"></h3></header>
              <ul id="adm-pedidos" class="lista-dash"></ul>
            </div>
          </div>
        </div>

        <!-- Productos -->
        <div class="adm-panel" data-panel="productos" hidden>
          <div class="barra">
            <input id="adm-buscar" type="search" data-i18n-placeholder="adm.p.buscar" />
            <span class="espacio"></span>
            <button id="adm-nuevo" type="button" class="btn btn--negro">+ <span data-i18n="adm.p.nuevo"></span></button>
          </div>
          <div class="tabla-envoltura">
            <table class="tabla tabla--admin">
              <thead><tr>
                <th data-i18n="adm.p.producto"></th><th data-i18n="adm.p.categoria"></th><th data-i18n="adm.p.precio"></th>
                <th data-i18n="adm.p.desc"></th><th data-i18n="adm.p.stock"></th><th data-i18n="adm.p.hasta"></th><th></th>
              </tr></thead>
              <tbody id="adm-tabla"></tbody>
            </table>
          </div>
        </div>

        <!-- Descuentos -->
        <div class="adm-panel" data-panel="descuentos" hidden>
          <div class="dash dash--dos">
            <form id="form-desc-cat" class="tarjeta-dash form">
              <h3 data-i18n="adm.d.masivo"></h3>
              <p class="nota" data-i18n="adm.d.masivoSub"></p>
              <div class="fila">
                <select id="adm-desc-cat" aria-label="Categoría"></select>
                <input id="adm-desc-pct" type="number" min="0" max="90" value="20" aria-label="%" />
                <button type="submit" class="btn btn--negro" data-i18n="adm.d.aplicar"></button>
              </div>
              <button id="adm-quitar-desc" type="button" class="btn btn--contorno" data-i18n="adm.d.quitarTodos"></button>
            </form>
            <div class="tarjeta-dash">
              <h3 data-i18n="adm.d.promos"></h3>
              <p class="nota" data-i18n="adm.d.promosSub"></p>
              <div id="adm-promos" class="lista-interruptores"></div>
            </div>
          </div>
        </div>

        <!-- IA de gestión (diferente a la IA de clientes) -->
        <div class="adm-panel" data-panel="ia" hidden>
          <div class="asistente">
            <div class="chat chat--admin" data-chat="admin">
              <div class="chat__cabeza">
                <div><strong data-i18n="adm.ia.titulo"></strong> <span class="nota" data-i18n="adm.ia.sub"></span></div>
                <button class="btn-icono chat__reset" type="button" data-i18n-title="asis.nueva">↺</button>
              </div>
              <div class="chat__mensajes" aria-live="polite">
                <div class="chat__vacio">
                  <img src="logo.svg" alt="" width="56" height="56" />
                  <h3 class="titulo-display" data-i18n="adm.ia.hola"></h3>
                  <div class="chips">
                    <button type="button" class="chip" data-i18n="adm.ia.s1"></button>
                    <button type="button" class="chip" data-i18n="adm.ia.s2"></button>
                    <button type="button" class="chip" data-i18n="adm.ia.s3"></button>
                    <button type="button" class="chip" data-i18n="adm.ia.s4"></button>
                  </div>
                </div>
              </div>
              <form class="chat__form">
                <textarea rows="1" data-i18n-placeholder="adm.ia.placeholder" autocomplete="off"></textarea>
                <button class="btn btn--negro" type="submit" data-i18n="asis.enviar"></button>
              </form>
            </div>
            <aside class="asistente__lado">
              <div class="panel-lateral">
                <h3 data-i18n="adm.ia.diferencias"></h3>
                <ul class="lista-puntos">
                  <li data-i18n="adm.ia.d1"></li>
                  <li data-i18n="adm.ia.d2"></li>
                  <li data-i18n="adm.ia.d3"></li>
                  <li data-i18n="adm.ia.d4"></li>
                </ul>
              </div>
            </aside>
          </div>
        </div>

        <!-- Configuración -->
        <div class="adm-panel" data-panel="config" hidden>
          <form id="form-config" class="tarjeta-dash form form--config">
            <label><span data-i18n="adm.c.tienda"></span><input id="cfg-tienda" maxlength="40" /></label>
            <label><span data-i18n="adm.c.franja"></span><input id="cfg-franja" maxlength="140" /></label>
            <div class="fila">
              <label><span data-i18n="adm.c.tema"></span>
                <select id="cfg-tema"><option value="sistema" data-i18n="adm.c.sistema"></option><option value="claro" data-i18n="adm.c.claro"></option><option value="oscuro" data-i18n="adm.c.oscuro"></option></select>
              </label>
              <label><span data-i18n="adm.c.idioma"></span>
                <select id="cfg-idioma"><option value="es">Español</option><option value="en">English</option></select>
              </label>
            </div>
            <div class="fila-botones">
              <button id="cfg-restaurar" type="button" class="btn btn--contorno" data-i18n="adm.c.restaurar"></button>
              <span class="espacio"></span>
              <button type="submit" class="btn btn--negro" data-i18n="comun.guardar"></button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= Pie ================= -->
  <footer class="pie">
    <div class="contenedor pie__grid">
      <div>
        <span class="marca__nombre">CORBET<span class="marca__ia">IA</span></span>
        <p data-i18n="pie.desc"></p>
      </div>
      <div>
        <h4 data-i18n="pie.secciones"></h4>
        <a href="#catalogo" data-i18n="nav.catalogo"></a>
        <a href="#promociones" data-i18n="nav.promociones"></a>
        <a href="#asistente" data-i18n="nav.asistente"></a>
        <a href="#sucursales" data-i18n="nav.sucursales"></a>
      </div>
      <div>
        <h4 data-i18n="pie.ayuda"></h4>
        <a href="#sucursales" data-i18n="nav.sucursales"></a>
        <button type="button" id="abrir-creditos" class="enlace" data-i18n="pie.creditos"></button>
      </div>
    </div>
    <div class="contenedor pie__legal"><span>© <span id="anio"></span> CORBET-IA</span><span data-i18n="pie.legal"></span></div>
  </footer>

  <!-- ================= Carrito ================= -->
  <div id="velo" class="velo"></div>
  <aside id="panel-carrito" class="panel" aria-hidden="true">
    <header class="panel__cabeza">
      <h2 class="titulo-display" data-i18n="carrito.titulo"></h2>
      <button id="cerrar-carrito" class="btn-icono" type="button" aria-label="Cerrar">✕</button>
    </header>
    <div id="items-carrito" class="panel__cuerpo"></div>
    <footer class="panel__pie">
      <div class="total"><span data-i18n="carrito.subtotal"></span><strong id="total-carrito"></strong></div>
      <span id="ahorro-carrito" class="ahorro"></span>
      <button id="pagar" class="btn btn--negro ancho" type="button" data-i18n="carrito.pagar"></button>
    </footer>
  </aside>

  <!-- ================= Diálogos ================= -->
  <dialog id="dlg-cuenta" class="dialogo dialogo--login">
    <div id="cuenta-invitado" class="login">
      <div class="login__marca" aria-hidden="true">
        <img src="logo-blanco.svg" alt="" width="88" height="88" />
        <h2 class="titulo-display">CORBET<span class="marca__ia">IA</span></h2>
        <p data-i18n="cuenta.lema"></p>
        <ul>
          <li data-i18n="cuenta.b1"></li>
          <li data-i18n="cuenta.b2"></li>
          <li data-i18n="cuenta.b3"></li>
        </ul>
      </div>
      <div class="login__form">
        <button type="button" class="btn-icono login__cerrar cerrar-dialogo" aria-label="Cerrar">✕</button>
        <h2 class="titulo-display" data-i18n="cuenta.bienvenido"></h2>
        <p class="nota" data-i18n="cuenta.sub"></p>
        <div class="segmentos segmentos--ancho">
          <button type="button" class="segmento pestana activa" data-modo="ingresar" data-i18n="cuenta.ingresar"></button>
          <button type="button" class="segmento pestana" data-modo="registrar" data-i18n="cuenta.registrarse"></button>
        </div>
        <form id="form-cuenta" class="form">
          <label id="campo-nombre" hidden><span data-i18n="cuenta.nombre"></span><input id="cuenta-nombre" autocomplete="name" /></label>
          <label><span data-i18n="cuenta.correo"></span><input id="cuenta-correo" type="email" autocomplete="email" required /></label>
          <label><span data-i18n="cuenta.clave"></span><input id="cuenta-clave" type="password" autocomplete="current-password" required minlength="6" /></label>
          <p id="cuenta-error" class="resultado resultado--error" role="alert"></p>
          <button id="cuenta-enviar" class="btn btn--negro ancho" type="submit"></button>
        </form>
        <div class="login__demo">
          <span data-i18n="cuenta.demo"></span>
          <button type="button" class="chip" data-cuenta-demo="admin@corbet-ia.test">👑 admin@corbet-ia.test</button>
          <button type="button" class="chip" data-cuenta-demo="cliente@corbet-ia.test">🛍️ cliente@corbet-ia.test</button>
        </div>
        <p class="nota" data-i18n="cuenta.aviso"></p>
      </div>
    </div>
    <div id="cuenta-usuario" hidden>
      <h2 id="cuenta-saludo" class="titulo-display"></h2>
      <p id="cuenta-correo-txt" class="nota"></p>
      <h3 data-i18n="cuenta.pedidos"></h3>
      <div id="cuenta-pedidos" class="pedidos"></div>
      <div class="fila-botones">
        <button id="cuenta-salir" class="btn btn--contorno" type="button" data-i18n="cuenta.salir"></button>
        <span class="espacio"></span>
        <button class="btn btn--negro cerrar-dialogo" type="button" data-i18n="comun.cerrar"></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-conexion" class="dialogo">
    <form id="form-conexion" class="form">
      <h2 class="titulo-display" data-i18n="db.titulo"></h2>
      <p class="nota" data-i18n="db.texto"></p>
      <label><span data-i18n="db.url"></span><input id="db-url" type="url" placeholder="https://api.tu-empresa.com/productos" required /></label>
      <label><span data-i18n="db.token"></span><input id="db-key" type="password" autocomplete="off" /></label>
      <p class="nota"><span data-i18n="db.ejemplo"></span> <button type="button" id="usar-ejemplo" class="enlace" data-i18n="db.ejemploBtn"></button></p>
      <p id="db-resultado" class="resultado" role="status"></p>
      <div class="fila-botones">
        <button type="button" id="usar-demo" class="btn btn--contorno" data-i18n="db.demo"></button>
        <span class="espacio"></span>
        <button type="button" class="btn btn--contorno cerrar-dialogo" data-i18n="comun.cancelar"></button>
        <button type="submit" id="conectar" class="btn btn--negro" data-i18n="db.probar"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-producto" class="dialogo">
    <form id="form-producto" class="form">
      <h2 class="titulo-display" data-i18n="adm.p.nuevo"></h2>
      <label><span data-i18n="adm.p.nombre"></span><input name="nombre" required maxlength="120" /></label>
      <div class="fila">
        <label><span data-i18n="adm.p.marca"></span><input name="marca" maxlength="40" /></label>
        <label><span data-i18n="adm.p.sku"></span><input name="sku" maxlength="40" /></label>
      </div>
      <label><span data-i18n="adm.p.categoria"></span><select id="np-categoria" name="categoria"></select></label>
      <div class="fila">
        <label><span data-i18n="adm.p.precio"></span><input name="precio" type="number" min="0" step="100" required /></label>
        <label><span data-i18n="adm.p.desc"></span><input name="descuento" type="number" min="0" max="90" value="0" /></label>
        <label><span data-i18n="adm.p.stock"></span><input name="stock" type="number" min="0" value="10" /></label>
      </div>
      <div class="fila-botones">
        <span class="espacio"></span>
        <button type="button" class="btn btn--contorno cerrar-dialogo" data-i18n="comun.cancelar"></button>
        <button type="submit" class="btn btn--negro" data-i18n="comun.guardar"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-creditos" class="dialogo">
    <h2 class="titulo-display" data-i18n="pie.creditos"></h2>
    <p class="nota" data-i18n="pie.creditosTexto"></p>
    <ul id="lista-creditos" class="creditos"></ul>
    <div class="fila-botones"><span class="espacio"></span><button type="button" class="btn btn--negro cerrar-dialogo" data-i18n="comun.cerrar"></button></div>
  </dialog>

  <!-- Llamada con el asistente (voz) -->
  <dialog id="dlg-llamada" class="llamada" data-estado="escuchando">
    <span id="llamada-tiempo" class="llamada__tiempo">00:00</span>
    <h2 id="llamada-titulo" class="titulo-display"></h2>
    <div class="llamada__orbe" aria-hidden="true"><span></span><span></span><span></span><img src="logo-blanco.svg" alt="" /></div>
    <p id="llamada-estado" class="llamada__estado" role="status"></p>
    <p id="llamada-texto" class="llamada__texto"></p>
    <button id="colgar" type="button" class="llamada__colgar" data-i18n-title="voz.colgar">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c5-5 13-5 18 0l-2 3-4-1v-3a10 10 0 0 0-6 0v3l-4 1z"/></svg>
    </button>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
